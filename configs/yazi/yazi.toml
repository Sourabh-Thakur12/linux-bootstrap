[opener]
open = [
{ run = 'xdg-open "$@"', desc = "Open file", block = false}
]
edit = [
{ run = 'nvim "$@"', block = true }
]

split = [
{ run = 'nvim -O "$@', block = true }
]

[preview]
max_width = 600
max_height = 900



[open] 
rules = [
{ mime = "text/*",                use = "edit" },
  { mime = "application/msword",       use = "open" },
  { mime = "application/json",      use = "edit" },
  { mime = "application/javascript",use = "edit" },
  { mime = "application/pdf",       use = "open" },
  { mime = "*/", use = "open"}
]

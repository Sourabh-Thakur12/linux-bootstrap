#################################
# Shadows
#################################

shadow = true;
shadow-radius = 15;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.4;

#################################
# Fading
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
# Transparency
#################################

inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 0.9;

#################################
# Blur
#################################

blur-method = "dual_kawase";
blur-strength = 2;

blur-background-exclude = [
"class_g = 'Brave-browser'",
"class_g = 'firefox'",
"class_g = 'Chromium'"
];



#corner radius
corner-radius = 12;
rounded-corners-exclude = [ "class_g = 'i3-frame'"];
#################################
# Performance
#################################

backend = "xrender";
# vsync = true;
use-damage = true;
unredir-if-possible = true;
detect-client-opacity = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;

glx-no-stencil = true;
glx-no-rebind-pixmap = true;

xrender-sync-fence = true;
